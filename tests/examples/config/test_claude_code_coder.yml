# Test configuration for Claude Code coder
workorder:
  project:
    path: "./tests/test_projects/simple_project"
    workspace_root: "workspaces"
  intent:
    description: "Add a simple hello world function to the main module"

# Override the coder team to use Claude Code
orchestration:
  teams:
    coder:
      name: "Claude Code Coder Team"
      description: "Coder team that uses Claude Code for implementation"
      tasks:
        - name: "coder_phase"
          agent_type: "GenericLLMAgent"
          persona_key: "coder_claude_v1"
          description: "Implement code changes using Claude Code"
          output_config:
            format: "json"
            fields:
              - name: "coder_result"
                description: "Result of code implementation"
                required: true
              - name: "files_modified"
                description: "List of files modified"
                required: false
              - name: "summary"
                description: "Summary of changes made"
                required: false
      next_team: "none"

# Configure Claude Code runner for testing
llm_config:
  skills:
    claude_code_runner:
      mode: "cli"  # Use CLI mode
      cli_path: "claude"  # Assumes 'claude' is in PATH
      timeout: 60  # 1 minute timeout for testing
      configuration:
        cli:
          # For testing, we might want to add --dry-run or similar
          args: ["code", "--no-interactive"]