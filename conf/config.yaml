# Default composition for the C4H system
defaults:
  - provider@llm_config.providers.anthropic: anthropic
  - provider@llm_config.providers.openai: openai
  - provider@llm_config.providers.gemini: gemini
  - provider@llm_config.providers.xai: xai
  - team@orchestration.teams.discovery: discovery
  - team@orchestration.teams.solution: solution
  - team@orchestration.teams.coder: coder
  - team@orchestration.teams.fallback: fallback
  # Load all personas under llm_config.personas
  - persona@llm_config.personas.discovery_v1: discovery_v1
  - persona@llm_config.personas.discovery_by_skill_v1: discovery_by_skill_v1
  - persona@llm_config.personas.solution_designer_v1: solution_designer_v1
  - persona@llm_config.personas.coder_v1: coder_v1
  - persona@llm_config.personas.coder_claude_v1: coder_claude_v1
  # Load agent configuration for lineage
  - llm_config/agents/lineage@llm_config.agents.lineage
  # Load skills configuration
  - skills/claude_code_runner@llm_config.skills
  - skills/change_validator@llm_config.skills
  - _self_

# Placeholder for runtime-injected workorder (project and intent)
workorder:
  project:
    path: ???
    workspace_root: "workspaces"
  intent:
    description: ???

# Global settings moved from the old system_config.yml
logging:
  level: "debug"
  format: "structured"
  agent_level: "debug"
  providers:
    anthropic:
      level: "debug"
    openai:
      level: "debug"
  truncate:
    prefix_length: 2000
    suffix_length: 1000

runtime:
  workflow:
    storage:
      enabled: true
      root_dir: "workspaces/workflows"
      format: "yymmdd_hhmm_{workflow_id}"
      retention:
        max_runs: 10
        max_days: 30
      error_handling:
        ignore_storage_errors: true
        log_level: "ERROR"
  lineage:
    enabled: true
    namespace: "c4h_agents"
    separate_input_output: true
    backend:
      type: "file"
      path: "workspaces/lineage"
    error_handling:
      ignore_failures: true
      log_level: "ERROR"
    context:
      include_metrics: true
      include_token_usage: true
      record_timestamps: true
    retry:
      enabled: true
      max_attempts: 3
      initial_delay: 1
      max_delay: 30
      backoff_factor: 2
      retry_on:
        - "overloaded_error"
        - "rate_limit_error"
        - "timeout_error"

backup:
  enabled: true
  path: "workspaces/backups"

llm_config:
  default_provider: "anthropic"
  default_model: "claude-3-5-sonnet-20241022"
  # Providers will be populated by the defaults list above

orchestration:
  enabled: true
  entry_team: "discovery"
  max_total_teams: 30
  max_recursion_depth: 5
  error_handling:
    retry_teams: true
    max_retries: 2
    log_level: "ERROR"
  # Teams will be populated by the defaults list above